name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jars
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            velociboard-velocity/build/libs/VelociBoard-Velocity-*.jar \
            velociboard-paper/build/libs/VelociBoard-Paper-*.jar \
            --title "$GITHUB_REF_NAME" --generate-notes
