name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: VelociBoard
          path: |
            velociboard-velocity/build/libs/VelociBoard-Velocity-*.jar
            velociboard-paper/build/libs/VelociBoard-Paper-*.jar
